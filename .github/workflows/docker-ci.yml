name: Docker CI

on:
  push:
    branches:
      - master
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flask image
        run: docker build -t flask-app ./app

      - name: Build Docker Compose services
        run: docker-compose build
